version: '3.8'

# Massachusetts Scraper - Foreclosure Only (Portainer Stack)
# Configuração otimizada para Runner 5 (Landmark Auction)

services:
  massachusetts-foreclosure:
    image: massachusetts-scraper:v1.0.0
    container_name: ma-foreclosure-scraper
    hostname: ma-foreclosure-prod
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=${RUNNER_MODE:-5}
      - SCHEDULE_HOUR=${SCHEDULE_HOUR:-6}
      
      # Configurações de Scraping
      - DAYS_BACK=${DAYS_BACK:-7}
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-true}
      
      # Configurações de Webhook
      - WEBHOOK_URL=${WEBHOOK_URL}
      - SEND_WEBHOOK=${SEND_WEBHOOK:-true}
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=${ENABLE_ENRICHMENT:-true}
      - FORCE_REENRICHMENT=${FORCE_REENRICHMENT:-false}
      
      # Configurações de Ambiente
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Configurações Opcionais
      - OCR_API_URL=${OCR_API_URL:-}
      - API_PORT=${API_PORT:-3000}
      
    volumes:
      # Dados persistentes
      - ma_foreclosure_data:/app/data
      - ma_foreclosure_config:/app/config
      - ma_foreclosure_logs:/app/logs
      - ma_foreclosure_browser:/app/playwright_user_data
      - ma_foreclosure_cache:/app/playwright_user_data_cache
      
    ports:
      # API interna (opcional)
      - "${API_PORT:-3000}:3000"
      
    networks:
      - foreclosure_network
      
    restart: unless-stopped
    
    # Comando para Massachusetts system
    command: massachusetts
    
    # Health check específico para Foreclosure
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Foreclosure Scraper OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Labels para organização no Portainer
    labels:
      - "traefik.enable=false"
      - "com.massachusetts.scraper=foreclosure"
      - "com.massachusetts.version=v1.0.0"
      - "com.massachusetts.schedule=daily-06h"

# Volumes nomeados para persistência
volumes:
  ma_foreclosure_data:
    name: ma_foreclosure_data
    driver: local
  ma_foreclosure_config:
    name: ma_foreclosure_config
    driver: local
  ma_foreclosure_logs:
    name: ma_foreclosure_logs
    driver: local
  ma_foreclosure_browser:
    name: ma_foreclosure_browser
    driver: local
  ma_foreclosure_cache:
    name: ma_foreclosure_cache
    driver: local

# Rede isolada
networks:
  foreclosure_network:
    name: foreclosure_network
    driver: bridge