version: '3.8'

# Massachusetts Scraper - Foreclosure (Com GitHub Token)
# Versão que usa Personal Access Token para repositório privado

services:
  foreclosure-scraper:
    image: node:18-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=false
      
      # Configurações de Webhook (CONFIGURE AQUI)
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.arthuragrelli.com/webhook/scraping}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
      # GitHub Token para acesso ao repositório privado
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-marcelokarval}
      
    volumes:
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando que usa GitHub Token para clone
    command: >
      bash -c "
        echo '🚀 Iniciando Massachusetts Foreclosure Scraper...' &&
        
        # Verificar se o token foi fornecido
        if [ -z \"$$GITHUB_TOKEN\" ]; then
          echo '❌ GITHUB_TOKEN não configurado!';
          echo '📝 Configure o token nas variáveis de ambiente do Portainer';
          echo '🔗 Crie em: https://github.com/settings/tokens';
          sleep 30;
          exit 1;
        fi &&
        
        echo '📦 Instalando dependências do sistema...' &&
        apt-get update -qq &&
        apt-get install -y -qq git curl wget gnupg ca-certificates &&
        
        echo '🔐 Configurando autenticação GitHub...' &&
        git config --global credential.helper store &&
        echo \"https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com\" > ~/.git-credentials &&
        
        echo '📥 Clonando repositório privado...' &&
        git clone -q https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com/marcelokarval/scraping-nilson.git /tmp/scraper &&
        echo '✅ Repositório clonado com sucesso' &&
        
        cd /tmp/scraper &&
        echo '🔄 Mudando para branch gemini/massachusetts-system-2...' &&
        git checkout -q gemini/massachusetts-system-2 &&
        echo '✅ Branch alterada com sucesso' &&
        
        echo '📁 Copiando arquivos para /app...' &&
        cp -r . /app/ &&
        cd /app &&
        echo '✅ Arquivos copiados com sucesso' &&
        
        echo '� Verificando arquivos copiados...' &&
        ls -la &&
        echo '📋 Verificando package.json...' &&
        cat package.json | head -10 &&
        
        echo '�📦 Instalando dependências Node (com logs)...' &&
        npm install &&
        
        echo '✅ NPM install concluído' &&
        echo '🎭 Instalando Playwright browsers...' &&
        npx playwright install chromium --with-deps &&
        echo '✅ Playwright instalado com sucesso' &&
        
        echo '🧹 Limpando credenciais...' &&
        rm -f ~/.git-credentials &&
        
        echo '✅ Iniciando Massachusetts Scraper...' &&
        npx ts-node runners/MA/main.ts
      "
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

# Volumes para persistência
volumes:
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local