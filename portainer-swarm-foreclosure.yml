version: '3.8'

# Massachusetts Scraper - Foreclosure Only (Docker Swarm)
# Versão simplificada compatível com Docker Swarm

services:
  foreclosure-scraper:
    image: node:18-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=true
      
      # Configurações de Webhook (CONFIGURE AQUI)
      - WEBHOOK_URL=${WEBHOOK_URL:-https://webhook.site/#!/your-unique-id}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
    volumes:
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando que instala tudo e executa o scraper
    command: >
      bash -c "
        echo '🚀 Iniciando Massachusetts Foreclosure Scraper...' &&
        apt-get update -qq &&
        apt-get install -y -qq git curl wget gnupg ca-certificates &&
        echo '📦 Clonando repositório...' &&
        git clone -q https://github.com/marcelokarval/scraping-nilson.git /tmp/scraper &&
        cd /tmp/scraper &&
        git checkout -q gemini/massachusetts-system-2 &&
        cp -r . /app/ &&
        cd /app &&
        echo '📥 Instalando dependências...' &&
        npm install --silent &&
        echo '🎭 Instalando Playwright...' &&
        npx playwright install chromium --with-deps &&
        echo '✅ Iniciando scraper...' &&
        npx ts-node runners/MA/main.ts
      "
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

# Volumes para persistência
volumes:
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local