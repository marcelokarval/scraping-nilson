version: '3.8'

# Massachusetts Scraper - Foreclosure (Debug Version)
# Versão com logs detalhados para identificar problemas

services:
  foreclosure-scraper:
    image: node:18-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=false
      
      # Configurações de Webhook
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.arthuragrelli.com/webhook/scraping}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
      # GitHub Token para acesso ao repositório privado
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-marcelokarval}
      
    volumes:
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando com tratamento de erro detalhado
    command: >
      bash -c "
        set -e
        
        echo '🚀 Iniciando Massachusetts Foreclosure Scraper [Debug Mode]...' &&
        
        # Verificar token
        if [ -z \"$$GITHUB_TOKEN\" ]; then
          echo '❌ GITHUB_TOKEN não configurado!'
          exit 1
        fi &&
        
        echo '📦 Atualizando sistema e instalando dependências...' &&
        apt-get update -qq &&
        apt-get install -y -qq git curl wget gnupg ca-certificates build-essential python3 &&
        
        echo '🔐 Configurando Git...' &&
        git config --global credential.helper store &&
        echo \"https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com\" > ~/.git-credentials &&
        
        echo '📥 Clonando repositório...' &&
        git clone https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com/marcelokarval/scraping-nilson.git /tmp/scraper || {
          echo '❌ Erro ao clonar repositório'
          echo '🔍 Verificando conectividade...'
          curl -I https://github.com
          exit 1
        } &&
        
        echo '✅ Clone concluído, mudando para branch...' &&
        cd /tmp/scraper &&
        git checkout gemini/massachusetts-system-2 || {
          echo '❌ Erro ao mudar branch'
          echo '📋 Branches disponíveis:'
          git branch -a
          exit 1
        } &&
        
        echo '📁 Copiando arquivos...' &&
        cp -r . /app/ &&
        cd /app &&
        
        echo '📋 Verificando estrutura copiada...' &&
        ls -la &&
        
        if [ ! -f package.json ]; then
          echo '❌ package.json não encontrado!'
          exit 1
        fi &&
        
        echo '📦 Instalando dependências Node.js...' &&
        npm cache clean --force &&
        npm install --verbose || {
          echo '❌ Erro no npm install'
          echo '📋 Conteúdo do package.json:'
          cat package.json
          echo '📋 Arquivos no diretório:'
          ls -la
          exit 1
        } &&
        
        echo '🔧 Instalando tipos do Node.js...' &&
        npm install --save-dev @types/node ts-node typescript || {
          echo '❌ Erro ao instalar @types/node'
          exit 1
        } &&
        
        echo '✅ Dependencies instaladas com sucesso' &&
        echo '🎭 Instalando Playwright...' &&
        npx playwright install chromium --with-deps || {
          echo '❌ Erro ao instalar Playwright'
          exit 1
        } &&
        
        echo '🧹 Limpando credenciais...' &&
        rm -f ~/.git-credentials &&
        
        echo '🔍 Verificando estrutura final...' &&
        ls -la runners/MA/ &&
        
        echo '✅ Tudo pronto! Iniciando scraper...' &&
        echo '🔍 Verificando versões...' &&
        node --version &&
        npm --version &&
        npx ts-node --version &&
        
        echo '🚀 Executando Massachusetts Scraper...' &&
        npx ts-node --esm runners/MA/main.ts || {
          echo '❌ Erro ao executar scraper'
          echo '🔍 Tentando com transpile-only...'
          npx ts-node --transpile-only runners/MA/main.ts || {
            echo '❌ Erro mesmo com transpile-only'
            echo '📋 Conteúdo do diretório runners/MA:'
            ls -la runners/MA/
            echo '📋 Verificando tsconfig.json:'
            cat tsconfig.json || echo 'tsconfig.json não encontrado'
            exit 1
          }
        }
      "
    
    # Health check mais generoso
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || ps aux | grep -q 'npm' || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

# Volumes para persistência
volumes:
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local