version: '3.8'

# Massachusetts Scraper - Foreclosure (Sem GitHub Clone)
# Versão que cria o código diretamente no container

services:
  foreclosure-scraper:
    image: node:18-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=true
      
      # Configurações de Webhook (CONFIGURE AQUI)
      - WEBHOOK_URL=${WEBHOOK_URL:-https://webhook.site/#!/your-unique-id}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
    volumes:
      # Volume com código fonte (você precisa criar este volume manualmente)
      - scraper_source:/app
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando que só instala dependências e executa (código já deve estar no volume)
    command: >
      bash -c "
        echo '🚀 Iniciando Massachusetts Foreclosure Scraper...' &&
        if [ ! -f package.json ]; then
          echo '❌ Código não encontrado! Verifique o volume scraper_source';
          echo '📝 Instruções:';
          echo '   1. Clone o repositório no servidor';
          echo '   2. Copie os arquivos para o volume';
          echo '   3. Reinicie o serviço';
          sleep 30;
          exit 1;
        fi &&
        echo '📥 Atualizando sistema...' &&
        apt-get update -qq &&
        apt-get install -y -qq ca-certificates curl gnupg &&
        echo '📦 Instalando dependências Node...' &&
        npm install --silent &&
        echo '🎭 Instalando Playwright...' &&
        npx playwright install chromium --with-deps &&
        echo '✅ Iniciando Massachusetts Scraper...' &&
        npx ts-node runners/MA/main.ts
      "
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

# Volumes para persistência
volumes:
  scraper_source:
    driver: local
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local