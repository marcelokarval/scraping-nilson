version: '3.8'

# Massachusetts Scraper - Foreclosure (Swarm + Public Access)
# Versão que funciona sem autenticação GitHub

services:
  foreclosure-scraper:
    image: node:18-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=true
      
      # Configurações de Webhook (CONFIGURE AQUI)
      - WEBHOOK_URL=${WEBHOOK_URL:-https://webhook.site/#!/your-unique-id}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
    volumes:
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando alternativo usando wget/curl para download público
    command: >
      bash -c "
        echo '🚀 Iniciando Massachusetts Foreclosure Scraper...' &&
        apt-get update -qq &&
        apt-get install -y -qq curl wget unzip ca-certificates &&
        echo '📦 Baixando código fonte...' &&
        wget -q -O /tmp/source.zip https://github.com/marcelokarval/scraping-nilson/archive/refs/heads/gemini/massachusetts-system-2.zip &&
        cd /tmp &&
        unzip -q source.zip &&
        mv scraping-nilson-gemini-massachusetts-system-2/* /app/ &&
        cd /app &&
        echo '📥 Instalando dependências Node...' &&
        npm install --silent &&
        echo '🎭 Instalando Playwright e dependências...' &&
        apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2 &&
        npx playwright install chromium --with-deps &&
        echo '✅ Tudo instalado! Iniciando scraper...' &&
        npx ts-node runners/MA/main.ts
      "
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

# Volumes para persistência
volumes:
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local