version: '3.8'

services:
  massachusetts-scraper:
    build: .
    container_name: ma-scraper-dev
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_HEADLESS=false
      - DAYS_BACK=0
      - ENABLE_ENRICHMENT=true
      - SEND_WEBHOOK=true
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:3001/webhook}
      - OCR_API_URL=${OCR_API_URL:-http://localhost:3002/ocr}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - massachusetts_browser_data:/app/playwright_user_data
      # Para desenvolvimento - mount do código
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "5900:5900" # VNC para visualizar browser se necessário
    restart: unless-stopped
    command: massachusetts
    
    # Recursos limitados
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Webhook receiver para testes (opcional)
  webhook-receiver:
    image: node:18-alpine
    container_name: ma-webhook-receiver
    ports:
      - "3001:3001"
    command: |
      sh -c "
        npm init -y &&
        npm install express &&
        node -e \"
          const express = require('express');
          const app = express();
          app.use(express.json());
          app.post('/webhook', (req, res) => {
            console.log('[WEBHOOK]', new Date().toISOString(), JSON.stringify(req.body, null, 2));
            res.json({status: 'received'});
          });
          app.listen(3001, () => console.log('Webhook receiver running on port 3001'));
        \"
      "
    restart: unless-stopped
    profiles: 
      - testing

volumes:
  massachusetts_browser_data:
    driver: local