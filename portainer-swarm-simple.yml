version: '3.8'

# Massachusetts Scraper - Foreclosure (Simples e Funcional)
# Versão que compila TypeScript para JavaScript primeiro

services:
  foreclosure-scraper:
    image: node:18-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=false
      
      # Configurações de Webhook
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.arthuragrelli.com/webhook/scraping}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
      # GitHub Token para acesso ao repositório privado
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-marcelokarval}
      
    volumes:
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando que compila TS para JS primeiro
    command: >
      bash -c "
        set -e
        
        echo '🚀 Massachusetts Foreclosure Scraper [Compile Mode]...' &&
        
        # Verificar token
        if [ -z \"$$GITHUB_TOKEN\" ]; then
          echo '❌ GITHUB_TOKEN não configurado!'
          exit 1
        fi &&
        
        echo '📦 Instalando dependências do sistema...' &&
        apt-get update -qq &&
        apt-get install -y -qq git curl wget build-essential python3 &&
        
        echo '📥 Clonando e preparando código...' &&
        git config --global credential.helper store &&
        echo \"https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com\" > ~/.git-credentials &&
        git clone https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com/marcelokarval/scraping-nilson.git /tmp/scraper &&
        cd /tmp/scraper &&
        git checkout gemini/massachusetts-system-2 &&
        cp -r . /app/ &&
        cd /app &&
        
        echo '📦 Instalando dependências...' &&
        npm install &&
        npm install -g typescript ts-node @types/node &&
        
        echo '🔨 Compilando TypeScript...' &&
        npx tsc --build || {
          echo '⚠️ Erro na compilação, tentando transpile-only...'
          mkdir -p dist
          npx tsc --outDir dist --target ES2020 --module CommonJS --esModuleInterop --skipLibCheck runners/MA/main.ts || {
            echo '❌ Erro na compilação TypeScript'
            exit 1
          }
        } &&
        
        echo '🎭 Instalando Playwright...' &&
        npx playwright install chromium --with-deps &&
        
        echo '🧹 Limpando credenciais...' &&
        rm -f ~/.git-credentials &&
        
        echo '✅ Iniciando scraper compilado...' &&
        if [ -f dist/main.js ]; then
          echo '🚀 Executando versão compilada...'
          node dist/main.js
        else
          echo '🚀 Executando com ts-node...'
          npx ts-node --transpile-only --esm runners/MA/main.ts
        fi
      "
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

# Volumes para persistência
volumes:
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local