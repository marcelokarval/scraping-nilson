version: '3.8'

# Massachusetts Scraper - Foreclosure (Definitivo)
# Versão que resolve todos os problemas de TypeScript

services:
  foreclosure-scraper:
    image: node:20-slim
    
    environment:
      # Configurações do Scheduler - Runner 5 (Foreclosure)
      - RUNNER_MODE=5
      - SCHEDULE_HOUR=6
      
      # Configurações de Scraping
      - DAYS_BACK=7
      - PLAYWRIGHT_HEADLESS=false
      
      # Configurações de Webhook
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.arthuragrelli.com/webhook/scraping}
      - SEND_WEBHOOK=true
      
      # Configurações de Enriquecimento
      - ENABLE_ENRICHMENT=true
      - FORCE_REENRICHMENT=false
      
      # Configurações de Ambiente
      - NODE_ENV=production
      - LOG_LEVEL=info
      
      # GitHub Token para acesso ao repositório privado
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GITHUB_USER:-marcelokarval}
      
      # Configurações de ambiente para evitar warnings
      - DEBIAN_FRONTEND=noninteractive
      - TERM=xterm
      
    volumes:
      # Dados persistentes
      - foreclosure_data:/app/data
      - foreclosure_logs:/app/logs
      - foreclosure_browser:/app/playwright_user_data
      
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        
    working_dir: /app
    
    # Comando que ignora TypeScript e executa diretamente com ts-node
    command:
      - bash
      - -c
      - |
        set -e
        
        echo '🚀 Massachusetts Foreclosure Scraper [Direct Mode]...'
        
        # Verificar token
        if [ -z "$$GITHUB_TOKEN" ]; then
          echo '❌ GITHUB_TOKEN não configurado!'
          exit 1
        fi
        
        echo '📦 Instalando dependências do sistema...'
        apt-get update -qq
        apt-get install -y -qq git curl wget build-essential python3 ca-certificates
        
        echo '📥 Preparando código fonte...'
        git config --global credential.helper store
        echo "https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com" > ~/.git-credentials
        git clone https://$$GITHUB_USER:$$GITHUB_TOKEN@github.com/marcelokarval/scraping-nilson.git /tmp/scraper
        cd /tmp/scraper
        git checkout gemini/massachusetts-system-2
        cp -r . /app/
        cd /app
        
        echo '📦 Instalando ALL Node.js dependencies...'
        npm install
        npm install -g typescript ts-node
        npm install --save-dev @types/node @types/fs-extra @types/crypto-js
        
        echo '🎭 Instalando Playwright browsers...'
        npx playwright install chromium --with-deps
        
        echo '🧹 Limpando credenciais...'
        rm -f ~/.git-credentials
        
        echo '🔧 Criando tsconfig.json otimizado com DOM...'
        cat > tsconfig.json << 'EOF'
        {
          "compilerOptions": {
            "target": "ES2022",
            "module": "CommonJS",
            "lib": ["ES2022", "DOM", "DOM.Iterable"],
            "outDir": "./dist",
            "rootDir": ".",
            "strict": false,
            "esModuleInterop": true,
            "allowSyntheticDefaultImports": true,
            "skipLibCheck": true,
            "forceConsistentCasingInFileNames": true,
            "moduleResolution": "node",
            "resolveJsonModule": true,
            "declaration": false,
            "removeComments": true,
            "downlevelIteration": true,
            "experimentalDecorators": true,
            "emitDecoratorMetadata": true,
            "types": ["node"]
          },
          "include": ["**/*.ts"],
          "exclude": ["node_modules", "dist"]
        }
        EOF
        
        echo '✅ Executando scraper com configuração otimizada...'
        npx ts-node --transpile-only --compiler-options '{"module":"CommonJS","target":"ES2020","esModuleInterop":true,"allowSyntheticDefaultImports":true,"skipLibCheck":true}' runners/MA/main.ts || {
          echo '⚠️ Tentando alternativa...'
          export TS_NODE_TRANSPILE_ONLY=true
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","target":"ES2020","esModuleInterop":true,"allowSyntheticDefaultImports":true,"skipLibCheck":true,"types":["node"]}'
          npx ts-node runners/MA/main.ts
        }
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'node' || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

# Volumes para persistência
volumes:
  foreclosure_data:
    driver: local
  foreclosure_logs:
    driver: local
  foreclosure_browser:
    driver: local